<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Mật Khẩu Ngẫu Nhiên</title>
</head>
<body>

    <h2>Tạo mật khẩu ngẫu nhiên</h2>
    <button onclick="hienThiMatKhau()">Bấm để tạo mật khẩu</button>
    <p id="ketQua" style="font-weight: bold; font-size: 18px; color: blue;"></p>

    <!-- Đoạn code JavaScript được đặt trực tiếp trong file HTML -->
    <script>
        // Hàm tạo mật khẩu ngẫu nhiên 8 ký tự (chữ thường và số)
        function generateRandomPassword() {
          const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
          let password = '';
          
          for (let i = 0; i < 8; i++) {
            const randomIndex = Math.floor(Math.random() * chars.length);
            password += chars[randomIndex];
          }
          
          return password;
        }

        // Hàm gắn sự kiện để hiển thị ra màn hình khi bấm nút
        function hienThiMatKhau() {
          const newPassword = generateRandomPassword();
          document.getElementById('ketQua').innerText = "Mật khẩu của bạn: " + newPassword;
        }
    </script>

</body>
</html>
